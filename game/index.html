<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d8f1e8">
  <title>FOLDLINE — The Moving City</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #d8f1e8; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="FOLDLINE: fold the paper city to reconnect the courier's road"></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
